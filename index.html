<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Slot Machine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Fruit Slot Machine</h1>
        
        <!-- Marcador de saldo y apuestas -->
        <div class="scoreboard">
            <div>Saldo: <span id="balance">100</span>€</div>
            <div>Apuesta: <span id="bet">10</span>€</div>
        </div>
        
        <!-- Contenedor de los 3 rodillos -->
        <div class="slots-container">
            <!-- Rodillo 1 -->
            <div class="slot-window">
                <div class="reel" id="reel1">
                    <img src="images/cereza.png" alt="Cereza">
                    <img src="images/limon.png" alt="Limón">
                    <img src="images/sandia.png" alt="Sandía">
                    <img src="images/uva.png" alt="Uva">
                    <img src="images/siete.png" alt="Siete">
                </div>
            </div>
            <!-- Rodillo 2 -->
            <div class="slot-window">
                <div class="reel" id="reel2">
                    <img src="images/cereza.png" alt="Cereza">
                    <img src="images/limon.png" alt="Limón">
                    <img src="images/sandia.png" alt="Sandía">
                    <img src="images/uva.png" alt="Uva">
                    <img src="images/siete.png" alt="Siete">
                </div>
            </div>
            <!-- Rodillo 3 -->
            <div class="slot-window">
                <div class="reel" id="reel3">
                    <img src="images/cereza.png" alt="Cereza">
                    <img src="images/limon.png" alt="Limón">
                    <img src="images/sandia.png" alt="Sandía">
                    <img src="images/uva.png" alt="Uva">
                    <img src="images/siete.png" alt="Siete">
                </div>
            </div>
        </div>

        <!-- Botones de parada individuales -->
        <div class="stop-buttons">
            <button id="btn-stop1" class="btn btn-stop" disabled>Parar 1</button>
            <button id="btn-stop2" class="btn btn-stop" disabled>Parar 2</button>
            <button id="btn-stop3" class="btn btn-stop" disabled>Parar 3</button>
        </div>

        <!-- Control de apuesta -->
        <div class="bet-controls">
            <button id="btn-bet-down" class="btn btn-bet">−</button>
            <span>Apuesta: <strong id="bet-display">10</strong>€</span>
            <button id="btn-bet-up" class="btn btn-bet">+</button>
            <button id="btn-allin" class="btn btn-allin">All In</button>
        </div>

        <!-- Panel de control -->
        <div class="controls">
            <button id="btn-spin" class="btn btn-spin">Girar</button>
        </div>

        <!-- Mensaje de resultado -->
        <div id="message" class="message">¡Apuesta: 10€, pulsa Girar!</div>

        <!-- Tabla de premios -->
        <div class="prize-table">
            <h3>Tabla de premios</h3>
            <table>
                <tr><th>Combinación</th><th>Premio</th></tr>
                <tr><td>🍒🍒🍒 Tres cerezas</td><td>×2</td></tr>
                <tr><td>🍋🍋🍋 Tres limones</td><td>×3</td></tr>
                <tr><td>🍉🍉🍉 Tres sandías</td><td>×5</td></tr>
                <tr><td>🍇🍇🍇 Tres uvas</td><td>×8</td></tr>
                <tr><td>7️⃣7️⃣7️⃣ Tres sietes</td><td>×20</td></tr>
                <tr class="pair-row"><td>🍇🍇 Pareja uvas</td><td>×2</td></tr>
                <tr class="pair-row"><td>7️⃣7️⃣ Pareja sietes</td><td>×5</td></tr>
                <tr class="pair-row"><td>Pareja cualquier otra</td><td>recuperas apuesta</td></tr>
            </table>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
